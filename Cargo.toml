[package]
name = "quickspark"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
description = "A lightweight native Windows quick launcher"
readme = "README.md"

[dependencies]
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
serde_json = "1.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Security_Credentials",
    "Win32_Networking_WinHttp",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = true
